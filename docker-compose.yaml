services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-insighttasklab}
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app} -d ${DB_NAME:-insighttasklab}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
